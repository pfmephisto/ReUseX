#
# Build-and-test CI, running on every push to main and every pull request
# (#202). The nix dependency closure (PCL, OpenCV, RTABMap, OpenMVS, libtorch,
# GTSAM, HiGHS, OpenNURBS — several rebuilt by our overlays) is far too large
# to build from scratch on a GitHub-hosted runner, so the paths that
# cache.nixos.org cannot serve are pulled from our own Cachix cache:
#
#   https://reusex.cachix.org   (public: reads need no token)
#
# See docs/guides/ci-cache.md for what lives in that cache, how big it is, and
# how to re-seed it from a dev machine.
#
# Cheap gates (clang-format, REUSE/SPDX, docs/gui YAML sanity) live in
# .github/workflows/lint.yml (#250) and deliberately do not touch nix at all.
#
# The local equivalents of this workflow are:
#   scripts/check.sh                          (fast incremental build + ctest)
#   nix build .#checks.x86_64-linux.tests     (hermetic build + ctest)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a quick follow-up commit should cancel the run it
# supersedes: a full C++ build is the most expensive thing in this repo's CI
# budget. main is exempt so every merged commit is actually built.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default: the build-and-test job also files warning issues
# on main-branch pushes, so it needs issues:write.  PRs and fork runs never
# reach the issue-filing step (guarded by the `if:` below) and the permission
# is harmless when unused.
permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    name: Build + ctest (CPU variant)
    runs-on: ubuntu-latest
    # CACHIX_AUTH_TOKEN is an *environment* secret scoped to the `CI`
    # environment, not a repo-level secret, so the job has to opt in here or
    # `secrets.CACHIX_AUTH_TOKEN` silently evaluates to the empty string.
    # The environment carries no protection rules and no branch policy, so
    # this neither gates nor delays the run.
    environment: CI
    # Warm (dependency closure already in Cachix) this is dominated by the
    # ReUseX compile itself on a 4-vCPU runner. The ceiling is generous so a
    # cold run — one where an overlay bump invalidated a big dependency — can
    # still finish and repopulate the cache rather than being killed halfway.
    timeout-minutes: 120
    steps:
      # No disk-cleanup step here on purpose. Measured on a green run with no
      # cleanup at all: / is 145 GB and still had 80 GB free at the end of the
      # job, with /nix/store at 7.0 GB. The widely-copied "free up runner disk
      # space" incantation cost 38 s to reclaim space nothing needed. If a
      # future dependency bump changes that, the "Report disk usage" step below
      # is what will show it.
      - uses: actions/checkout@v4
        with:
          # tests/fixtures/** binaries (.pcd/.db/.e57/.rux) are LFS-tracked and
          # ctest reads them, so pointer files would fail the suite.
          lfs: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: reusex
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Read from the cache everywhere; write only from main.
          #
          # Two reasons this is not just "push when the token exists":
          #  - the cache is on the 5 GB free tier, and `src = ./.` in
          #    default.nix is unfiltered, so *every* PR produces a distinct
          #    ReUseX-tests output. Pushing all of them would exhaust the
          #    quota in a few dozen PRs for no reuse benefit.
          #  - fork PRs get no secrets at all, so pushing could never work
          #    there anyway. Reads are unaffected: the cache is public.
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      # Builds the CPU variant (WITH_CUDA=OFF — the runners have no GPU) with
      # BUILD_TESTS=ON and runs ctest inside the sandbox. Fails the job on any
      # test failure.
      #
      # Build output is teed to build-warnings.log so the warning-sync step
      # below can parse compiler diagnostics without a second compile.  The
      # log is kept even on failure so warnings from a broken build are still
      # tracked.
      - name: Build and run tests
        run: nix build .#checks.x86_64-linux.tests --print-build-logs 2>&1 | tee build-warnings.log

      # Parse GCC/Clang warning lines from the build log and sync them to
      # GitHub issues (create new, close fixed, skip existing).  Only runs on
      # main-branch pushes — PRs and fork runs do not write issues.
      - name: Sync warning issues
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/file_build_warnings.py build-warnings.log

      # Cheap early warning: if the closure ever starts crowding the runner,
      # this is where it shows up first (7.0 GB store / 80 GB free as of the
      # last green run).
      - name: Report disk usage
        if: always()
        run: |
          du -sh /nix/store 2>/dev/null || true
          df -h /

  # The GUI frontend (apps/rux/frontend) is plain npm — no nix, no C++ closure —
  # so it does not depend on the Cachix cache at all. It rides along in this
  # workflow because it is the other thing a code change can break; it just
  # runs in parallel with the build above.
  frontend:
    name: GUI frontend (build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rux/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/rux/frontend
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`, so this is the
      # typecheck gate as well as the bundle gate.
      - name: Build
        working-directory: apps/rux/frontend
        run: npm run build

      - name: Test
        working-directory: apps/rux/frontend
        run: npm test
