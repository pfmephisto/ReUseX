#
# Build-and-test CI (drafted, not yet enabled on push/PR).
#
# Status: manual trigger only. The dependency closure (PCL, OpenCV, RTABMap,
# OpenMVS, libtorch — several rebuilt by our overlays) is too large to build
# from scratch on GitHub-hosted runners without a binary cache.
#
# Cheap gates (clang-format, REUSE/SPDX) no longer wait on this — they run on
# every push/PR from .github/workflows/lint.yml (#250), since they don't
# touch the nix closure at all.
#
# To enable this build-and-test job on push/PR (tracked in #202):
#   1. Create a Cachix cache (free for OSS): https://app.cachix.org
#   2. Add repo secret CACHIX_AUTH_TOKEN.
#   3. Seed the cache from a machine that has already built the CPU variant:
#        nix build .#cpu && nix build .#checks.x86_64-linux.tests
#        nix path-info --recursive .#cpu | cachix push reusex
#   4. Replace `workflow_dispatch` below with push/pull_request triggers.
#
# Until then, the equivalent local gates are:
#   scripts/check.sh                          (fast incremental build + ctest)
#   nix build .#checks.x86_64-linux.tests     (hermetic build + ctest)

name: CI

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  # ^ blocked on #202 (Cachix cache + CACHIX_AUTH_TOKEN secret)

# Least-privilege default: the build-and-test job only checks out, builds,
# and (optionally) pushes to Cachix with its own dedicated authToken — it
# never needs to write to the repo itself.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + ctest (CPU variant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: reusex
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only push when the token is available (not on forks).
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      # Builds the CPU variant with BUILD_TESTS=ON and runs ctest inside the
      # sandbox. Fails the job on any test failure.
      - name: Build and run tests
        run: nix build .#checks.x86_64-linux.tests --print-build-logs

  # The GUI frontend (apps/rux/frontend) is plain npm — no nix, no C++ closure —
  # so unlike build-and-test above it is cheap enough to run on a stock runner
  # today. It is packaged for nix separately (pkgs/reusex-gui-frontend), which
  # is why nothing here needs the Nix store.
  #
  # It's still gated by this workflow's workflow_dispatch-only trigger (GitHub
  # Actions triggers are per-workflow, not per-job) even though nothing about
  # it depends on #202 — moving it to lint.yml (or its own push/PR workflow)
  # is a reasonable, but separate, follow-up.
  frontend:
    name: GUI frontend (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rux/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/rux/frontend
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`, so this is the
      # typecheck gate as well as the bundle gate.
      - name: Build
        working-directory: apps/rux/frontend
        run: npm run build

      - name: Test
        working-directory: apps/rux/frontend
        run: npm test
