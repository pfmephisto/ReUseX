#
# Cheap, cache-free gates: clang-format and REUSE/SPDX compliance. Neither
# needs the nix dependency closure, so they run on every push/PR without
# waiting on the Cachix cache that the heavy build-and-test job in ci.yml
# needs (#202). The GUI OpenAPI YAML sanity check and the frontend build +
# vitest job moved with `ruxd`/the frontend to their own repos (repo split,
# P4, 2026-10-09).
#
# clang-format is pinned to 21.1.8 to match the version pre-commit uses
# (see flake.nix's pre-commit-hooks / the `clang-tools` package in the dev
# shell) so CI and the local hook agree on formatting.

name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: every job here only checks out and reads/lints,
# none of them need to write anything.
permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install clang-format (pinned to match pre-commit)
        run: pip install clang-format==21.1.8

      - name: Run clang-format (dry run)
        run: |
          git ls-files '*.cpp' '*.hpp' '*.cu' '*.cuh' \
            | xargs clang-format --dry-run --Werror

  reuse:
    name: REUSE / SPDX compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install reuse
        run: pip install reuse

      - name: Check REUSE compliance
        run: reuse lint
