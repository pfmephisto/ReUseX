#
# Compiler warning tracker.  Runs after each push to main that touches C++
# source, compiles with cmake inside the nix dev shell, and calls
# scripts/file_build_warnings.py to:
#   - create a GitHub issue for every new warning (label: build-warning)
#   - close issues whose warning has been fixed
#   - skip creation when an issue already exists (dedup by content hash)
#
# The job also runs on workflow_dispatch so you can trigger it manually.
#
# Why cmake inside nix develop rather than nix build?
#   nix build caches derivations by content hash — if the inputs haven't
#   changed, it returns the cached output instantly without recompiling, and
#   --print-build-logs produces nothing.  --rebuild sounds like the fix, but
#   it requires the derivation to already be in the *local* store to compare
#   against; CI runners start fresh so the output is always in Cachix, never
#   local, and nix errors out.
#
#   Running cmake directly inside `nix develop` sidesteps nix derivation
#   caching entirely: cmake always compiles from scratch (no cmake cache on
#   the runner), deps are still served from Cachix, and compiler warnings go
#   to cmake's stderr like normal.

name: Build Warnings

on:
  push:
    branches: [main]
    paths:
      - "libs/**"
      - "apps/**"
      - "bindings/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "default.nix"
  workflow_dispatch:

# Least privilege: only issues write is needed beyond the default read.
permissions:
  contents: read
  issues: write

jobs:
  track-warnings:
    name: Capture and file compiler warnings
    runs-on: ubuntu-latest
    environment: CI
    timeout-minutes: 120

    steps:
      # No lfs: true needed — we build with BUILD_TESTS=OFF so fixtures are
      # never read.
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      # Read from the cache (public, no token needed); never push from here.
      - uses: cachix/cachix-action@v16
        with:
          name: reusex
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Configure (populates nix dev shell from Cachix)
        run: |
          nix develop --command cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=OFF \
            -DWITH_CUDA=OFF

      - name: Build and capture warnings
        # continue-on-error so a build failure doesn't skip the issue-filing
        # step — we still want to track warnings from a broken build.
        continue-on-error: true
        run: |
          nix develop --command cmake --build build \
            --parallel "$(nproc)" \
            2>&1 | tee build-warnings.log

      - name: Sync warning issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/file_build_warnings.py build-warnings.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-warnings-log
          path: build-warnings.log
          retention-days: 7
