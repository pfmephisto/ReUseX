openapi: 3.1.0

info:
  title: ReUseX GUI API
  version: "1.0.0"
  description: |
    The shared contract between the ReUseX web frontend and its backends
    (issue #265).

    Two implementations serve this contract:

    * `rux gui` — a localhost Crow server embedded in the `rux` CLI. It opens
      one `.rux` project directly and runs pipeline stages **in-process** on a
      single worker thread.
    * `ruxd` — the headless daemon (Phase 6). It will implement the same paths
      backed by a persistent job queue and remote workers.

    The frontend is a pure client and must not be able to tell them apart.
    Consequently: job ids are opaque strings, no path ever carries a
    server-side filesystem location, and every long-running action goes through
    `/jobs` + the `/events` WebSocket rather than a blocking request.

    A server instance is bound to exactly ONE project for its lifetime — the
    project is selected when the server starts (`rux -p scan.rux gui`), not per
    request. Multi-project browsing is intentionally out of scope for v1.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later

servers:
  - url: http://localhost:8420/api/v1
    description: Default `rux gui` bind address

security: []
# No authentication in v1: `rux gui` binds to loopback and is single-user.
# Access control is an Origin allowlist enforced server-side (403 for a
# non-allowlisted browser origin) plus `Content-Type: application/json` on
# mutating routes. See docs/gui/README.md.
#
# The empty list is a real statement, not an omission: it says "this operation
# needs no credential", and a generated client honours it by sending none.
# `components.securitySchemes.bearerAuth` is nevertheless declared, because
# ruxd already takes `--auth-token` and will serve this same contract in
# Phase 6. A remote deployment overrides this document's top-level `security`
# with `[{bearerAuth: []}]`; the operations themselves do not change, so
# Phase 6 is a client *configuration* change rather than a regenerate-
# everything event.

tags:
  - name: meta
    description: Service health and self-description
  - name: project
    description: Project summary and metadata
  - name: clouds
    description: Point clouds
  - name: meshes
    description: Meshes and their textures
  - name: gsplats
    description: Gaussian splats trained by `rux create gsplat`
  - name: frames
    description: Sensor frames (color / depth / confidence / segmentation)
  - name: panoramas
    description: 360 panoramic images
  - name: components
    description: Building components
  - name: materials
    description: Material passports
  - name: instances
    description: Instance identity and material links
  - name: pipeline
    description: Stage catalogue and execution history
  - name: jobs
    description: Stage execution — submit, poll, cancel

paths:

  # ---------------------------------------------------------------- meta ----
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness probe and version handshake
      responses:
        "200":
          description: The server is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /endpoints:
    get:
      tags: [meta]
      operationId: listEndpoints
      summary: The route table this server actually serves
      description: |
        Self-description, so a client can detect an older/newer server without
        parsing this document. The list is generated from the same table the
        routes are registered from.
      responses:
        "200":
          description: Route table
          content:
            application/json:
              schema:
                type: object
                required: [endpoints]
                properties:
                  endpoints:
                    type: array
                    items: { $ref: "#/components/schemas/EndpointInfo" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------- project ----
  /project:
    get:
      tags: [project]
      operationId: getProjectSummary
      summary: Everything the dashboard needs in one request
      description: |
        Mirrors `ProjectDB::project_summary()`. Cheap enough to poll, and the
        canonical source for cloud/mesh/frame inventories.
      responses:
        "200":
          description: Project summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSummary" }
        "503": { $ref: "#/components/responses/ProjectUnavailable" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /projects:
    get:
      tags: [project]
      operationId: listProjects
      summary: Project metadata records stored in this database
      description: |
        A `.rux` file may carry more than one metadata record (a building may be
        surveyed in several campaigns). This is metadata only — it does not
        partition the clouds or meshes.

        Paged: `limit` defaults to the server maximum of 1000.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project metadata records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [projects]
                    properties:
                      projects:
                        type: array
                        items: { $ref: "#/components/schemas/ProjectInfo" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # -------------------------------------------------------------- clouds ----
  /clouds:
    get:
      tags: [clouds]
      operationId: listClouds
      summary: All named point clouds with their type and point count
      description: |
        Paged: `limit` defaults to the server maximum of 1000. A project holds
        a handful of named clouds, so the page exists to bound the response,
        not because anyone expects a second one.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cloud inventory
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [clouds]
                    properties:
                      clouds:
                        type: array
                        items: { $ref: "#/components/schemas/CloudInfo" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /clouds/{name}:
    get:
      tags: [clouds]
      operationId: getCloud
      summary: One cloud's metadata, including its label definitions
      parameters:
        - $ref: "#/components/parameters/CloudName"
      responses:
        "200":
          description: Cloud metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /clouds/{name}/points:
    get:
      tags: [clouds]
      operationId: getCloudPoints
      summary: A page of point data
      description: |
        Paged point access for the 3D viewport.

        Two wire formats, selected with `format`, carrying identical data over
        identical `offset`/`limit` semantics:

        - **`json`** (default) — the `CloudPointsPage` object below. Readable,
          `curl`-able, and the format to reach for when debugging. About 4.7×
          the bytes of `binary` for the same page of a `PointXYZRGB` cloud
          (measured: 69.9 vs 15.0 bytes/point).
        - **`binary`** — **RUXP v1**, `application/octet-stream`: a small
          self-describing header followed by planar (structure-of-arrays)
          little-endian sections, which a browser turns into
          `THREE.BufferAttribute`s with zero copies and no per-point work. The
          byte layout is specified in
          [`docs/gui/binary-points.md`](binary-points.md) — read it before
          writing a client.

        A page is served by reading only the bytes that page occupies in the
        `point_cloud_data` chunk store (SQLite incremental blob I/O), so server
        memory is proportional to the page, not to the cloud. This holds for
        both formats.

        The fields carried depend on the cloud's type:

        | Cloud type      | JSON `fields`   | RUXP fields              |
        |-----------------|-----------------|--------------------------|
        | `PointXYZRGB`   | `x,y,z,r,g,b`   | `xyz` f32×3, `rgb` u8×3  |
        | `PointXYZ`      | `x,y,z`         | `xyz` f32×3              |
        | `Normal`        | `nx,ny,nz`      | `normal` f32×3           |
        | `Label`         | `label`         | `label` u32×1            |

        Points are returned in storage order, which is index-aligned across the
        sibling clouds of one scan (`cloud`/`normals`/`planes`/`rooms`/
        `instances`/`labels`) — see `docs/CONTRACTS.md`. A client may therefore
        request the same `offset`/`limit` window from two clouds and zip them.

        A page past the end of the cloud is a `200` with `count = 0`, not a
        `404`; `total` is still populated, so `limit=1&offset=0` is a cheap way
        to ask how long a cloud is.

        ### Level of detail

        `max_points` asks a different question: **all** of the cloud, coarsely,
        instead of a prefix of it. The server voxel-subsamples the whole cloud
        and answers with one page of at most that many points, flagged as LOD
        (RUXP `flags` bit 0; JSON `lod: true`). `total` still means the whole
        cloud, `offset` is 0 and means nothing, and `count <= max_points` —
        typically 80–98 % of it.

        `max_points` is **mutually exclusive** with `offset` and `limit`: sending
        it with either is a `400`. A cloud with no positions of its own
        (`Normal`, `Label`) needs `lod_source` naming an index-aligned geometry
        cloud, or it is a `400` too.

        Full design, including why this is computed per request and what a
        precomputed progressive ordering would change:
        [`docs/gui/binary-points.md`](binary-points.md) § "Level of detail".
      parameters:
        - $ref: "#/components/parameters/CloudName"
        - name: offset
          in: query
          description: Index of the first point to return.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: >-
            Maximum points to return, following the shared paging idiom: `0`
            means the server maximum (1000000), a larger value is clamped
            rather than rejected. The default is much larger than for the
            object collections because the unit here is a point, not a record.
          schema:
            { type: integer, minimum: 0, maximum: 1000000, default: 100000 }
        - name: max_points
          in: query
          description: >-
            Budget for a level-of-detail read of the **whole** cloud, instead of
            a window of it. Clamped to the server maximum (1000000). Cannot be
            combined with `offset` or `limit` — that is a `400`.
          schema: { type: integer, minimum: 1, maximum: 1000000 }
        - name: lod_source
          in: query
          description: >-
            Cloud whose positions drive a `max_points` selection, for a sibling
            that has none of its own. The two must be index-aligned (same
            `total`); the resulting pages then describe the same points and can
            still be zipped positionally. Only meaningful with `max_points`.
          schema: { type: string }
        - name: format
          in: query
          description: |
            Wire format. `json` returns `CloudPointsPage`; `binary` returns a
            RUXP v1 octet-stream (`docs/gui/binary-points.md`).

            A server predating RUXP answers `501` for `binary`, so a client that
            wants to work against both should try `binary` first and fall back
            to `json` on a `501`.
          schema: { type: string, enum: [json, binary], default: json }
      responses:
        "200":
          description: A page of points
          headers:
            X-Ruxp-Version:
              description: |
                RUXP format version, on `format=binary` responses only.
                Mirrors the body header purely as a debugging convenience —
                the body header is authoritative and a client must not depend
                on these being present.
              schema: { type: integer }
            X-Ruxp-Type:
              description: Cloud point type, on `format=binary` responses only.
              schema: { type: string }
            X-Ruxp-Flags:
              description: >-
                Header `flags` word, on `format=binary` responses only. Bit 0
                means the page is a level-of-detail view of the whole cloud.
              schema: { type: integer }
            X-Ruxp-Offset:
              description: Page offset, on `format=binary` responses only.
              schema: { type: integer }
            X-Ruxp-Count:
              description: Points in this page, on `format=binary` responses only.
              schema: { type: integer }
            X-Ruxp-Total:
              description: Points in the cloud, on `format=binary` responses only.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudPointsPage" }
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: |
                  A RUXP v1 page: a 40-byte header, `16 * field_count` bytes of
                  field descriptors, then one tightly packed little-endian
                  section per field. Fully specified in
                  `docs/gui/binary-points.md`.
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # -------------------------------------------------------------- meshes ----
  /clouds/{name}/labels:
    get:
      tags: [clouds]
      operationId: getCloudLabels
      summary: The label legend of one Label cloud
      description: |
        Label id → display name, as stored in `label_definitions` for this
        cloud. The same map is embedded in `GET /clouds/{name}`; this endpoint
        exists so an editor can re-read just the legend after a write.

        Key `"0"` is never present — 0 means unlabeled (STANDARDS §3). Ids are
        strings because JSON object keys are.
      parameters:
        - $ref: "#/components/parameters/CloudName"
      responses:
        "200":
          description: The legend, possibly empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelLegend" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    patch:
      tags: [clouds]
      operationId: renameCloudLabels
      summary: Rename label classes of one Label cloud
      description: |
        Applies the given id → name pairs and leaves every other id untouched.
        Send only what changed.

        A name may not be empty, and an id must already exist in the legend:
        this endpoint renames classes, it does not invent them. Inventing one
        would put a name against an id no point carries, which reads as data
        loss rather than as the typo it is.

        **`instances` is refused.** The names in an instance-label cloud are
        generated as `SM<class>-<id> (<n>p)` and are *parsed back* by the v10
        schema migration and by `io/export_scene.cpp` to recover the semantic
        class. A free-text rename there would corrupt data that looks like a
        label but is really a record, so the server answers `409` rather than
        letting a UI offer it.

        Storage replaces the whole per-cloud map, so this is a read-modify-write
        and is performed under the project's writer lock — see the `409`/`503`
        responses.
      parameters:
        - $ref: "#/components/parameters/CloudName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelLegend" }
      responses:
        "200":
          description: The full legend after the rename
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelLegend" }
        "400":
          description: |
            Body was not an object, a key was not an integer, a name was empty
            or not a string, or an id is not in this cloud's legend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WriteConflict" }
        "415":
          description: Content-Type was not application/json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/WriterBusy" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /meshes:
    get:
      tags: [meshes]
      operationId: listMeshes
      summary: All stored meshes
      description: |
        Paged: `limit` defaults to the server maximum of 1000.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Mesh inventory
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [meshes]
                    properties:
                      meshes:
                        type: array
                        items: { $ref: "#/components/schemas/MeshInfo" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /meshes/{name}:
    get:
      tags: [meshes]
      operationId: getMesh
      summary: One mesh's metadata
      parameters:
        - $ref: "#/components/parameters/MeshName"
      responses:
        "200":
          description: Mesh metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeshInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /meshes/{name}/data:
    get:
      tags: [meshes]
      operationId: getMeshData
      summary: The mesh geometry blob, verbatim
      description: |
        The bytes exactly as stored, in the format reported by the mesh's
        `format` field (`ply` or `obj`). No transcoding happens server-side.
      parameters:
        - $ref: "#/components/parameters/MeshName"
      responses:
        "200":
          description: Mesh blob
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /meshes/{name}/textures:
    get:
      tags: [meshes]
      operationId: listMeshTextures
      summary: Texture metadata for a mesh (no image bytes)
      parameters:
        - $ref: "#/components/parameters/MeshName"
      responses:
        "200":
          description: Texture inventory
          content:
            application/json:
              schema:
                type: object
                required: [textures]
                properties:
                  textures:
                    type: array
                    items: { $ref: "#/components/schemas/TextureInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /meshes/{name}/textures/{texture}:
    get:
      tags: [meshes]
      operationId: getMeshTexture
      summary: One texture image
      parameters:
        - $ref: "#/components/parameters/MeshName"
        - name: texture
          in: path
          required: true
          description: The texture's `tex_name`.
          schema: { type: string }
      responses:
        "200":
          description: Texture image bytes
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------- gsplats ----
  /gsplats:
    get:
      tags: [gsplats]
      operationId: listGsplats
      summary: Gaussian splats stored in this project
      description: |
        The 3D Gaussian Splatting models `rux create gsplat` has trained into
        this project (schema v12), or that `rux import gsplat` has brought in
        from an INRIA `.ply` produced elsewhere. Stored in the `.rux` exactly
        as a mesh is, so this is a project read like any other and never
        touches a filesystem path.

        Metadata only. `byte_size` and `gaussian_count` are what let a client
        decide *before* fetching: unlike a cloud, which streams in pages, a
        splat is one response of hundreds of megabytes, so the viewport does
        not download it until the user switches the layer on.

        Deliberately **unpaged**, unlike `/clouds` and `/meshes`. A project
        holds a handful of splats — one per training run someone chose to keep
        — not a number that grows with the size of the scan. An empty array is
        the normal answer for a project nobody has run the trainer on.
      responses:
        "200":
          description: Splat inventory
          content:
            application/json:
              schema:
                type: object
                required: [gsplats]
                properties:
                  gsplats:
                    type: array
                    items: { $ref: "#/components/schemas/GsplatInfo" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /gsplats/{name}:
    get:
      tags: [gsplats]
      operationId: getGsplat
      summary: One Gaussian splat's metadata
      parameters:
        - $ref: "#/components/parameters/GsplatName"
      responses:
        "200":
          description: Splat record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GsplatInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /gsplats/{name}/data:
    get:
      tags: [gsplats]
      operationId: getGsplatData
      summary: The INRIA-format splat PLY, verbatim
      description: |
        The bytes exactly as stored. No transcoding happens server-side: the
        client's splat renderer parses the PLY itself.

        Call `GET /gsplats` first — this route is only meaningful for a name
        that appeared there.
      parameters:
        - $ref: "#/components/parameters/GsplatName"
      responses:
        "200":
          description: Splat PLY
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: |
            The splat is larger than the server will materialize in one
            response (1 GiB).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # -------------------------------------------------------------- frames ----
  /frames:
    get:
      tags: [frames]
      operationId: listFrames
      summary: Sensor frame ids and aggregate counts
      description: |
        Returns ids only, not per-frame poses — a scan can hold thousands of
        frames. Fetch `/frames/{id}` for the details of one.

        **Two different totals, deliberately.** `total_count` and
        `segmented_count` always describe the **whole scan**, never the
        filtered or paged result, so a browser can render "42 of 380 segmented"
        without a second request. `total` is the pagination envelope's field
        and counts the ids matching `segmented` — the number `ids` would have
        if it were not paged. With no `segmented` filter the two agree; that
        coincidence is not something to rely on.

        Paged: `limit` defaults to the server maximum of 10000 ids. A frame id
        is four bytes on the wire, so the cap is generous on purpose — it is
        there to stop an unbounded array, not to force clients to page a scan
        of ordinary size.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: segmented
          in: query
          description: |
            Restrict `ids` to frames that do (`true`) or do not (`false`) have
            a stored segmentation image. Omit for all frames.

            This is a server-side filter on purpose: the alternative is
            fetching `/frames/{id}` for every frame just to read one boolean,
            and that endpoint decodes the depth and confidence blobs to answer.
          schema: { type: boolean }
      responses:
        "200":
          description: Frame inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrameList" }
        "400":
          description: The `segmented` filter was not a boolean
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /frames/{id}:
    get:
      tags: [frames]
      operationId: getFrame
      summary: One sensor frame's pose, intrinsics and availability flags
      parameters:
        - $ref: "#/components/parameters/FrameId"
      responses:
        "200":
          description: Frame metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrameInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /frames/{id}/image:
    get:
      tags: [frames]
      operationId: getFrameImage
      summary: An encoded image for one sensor frame
      description: |
        Images are returned in their **stored orientation** — ReUseX applies no
        rotation on import, and the server applies none either.

        By default `depth` and `confidence` are single-channel and PNG-encoded
        at their native bit depth, so a client that wants metric depth must know
        the scale rather than reading pixel luminance. `segmentation` returns
        the label image with the storage encoding (`CV_16U`, 0 = unlabeled).

        That default is the *data*, and it is deliberately not displayable: a
        16-bit depth PNG in millimetres renders as near-black in a browser,
        because `<img>` decoding keeps the high byte and a 3 m room only reaches
        3000 of 65535. Pass `normalize=true` for a picture instead of the
        measurement — see below.
      parameters:
        - $ref: "#/components/parameters/FrameId"
        - name: kind
          in: query
          description: Which of the frame's images to encode.
          schema:
            type: string
            enum: [color, depth, confidence, segmentation]
            default: color
        - name: max_size
          in: query
          description: |
            Downscale so the longest edge is at most this many pixels,
            preserving aspect ratio. Never upscales. Intended for the thumbnail
            grid of a frame browser, where fetching hundreds of full-resolution
            frames is the difference between a usable screen and an unusable
            one.

            Label images (`kind=segmentation`) are resampled with
            nearest-neighbour so that no interpolated, non-existent label id is
            ever invented; every other kind uses area interpolation.
          schema: { type: integer, minimum: 1, maximum: 4096 }
        - name: normalize
          in: query
          description: |
            Render a **displayable** 8-bit image rather than the stored
            measurement. Ignored for `kind=color`, which is already displayable.

            * `depth` / `confidence` — mapped to 8-bit grey across the
              observed range of valid (non-zero) pixels, which is reported in
              the `X-Image-Range-Min` / `X-Image-Range-Max` response headers
              so a caller can label a scale.
            * `segmentation` — colourised with the same categorical palette the
              viewport uses, with label 0 (unlabeled) rendered black.

            The result carries **no metric scale** and must not be measured;
            it exists to be looked at. Omit it to get the stored values.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: |
            Encoded image. `normalize=true` answers 8-bit grey (depth,
            confidence) or 8-bit RGB (segmentation); otherwise the stored bit
            depth is preserved.
          headers:
            X-Image-Range-Min:
              description: |
                Lowest valid stored value mapped by `normalize=true`
                (millimetres for `depth`). A convenience only — absent unless
                normalising a single-channel kind, and never load-bearing.
              schema: { type: number }
            X-Image-Range-Max:
              description: Highest valid stored value mapped by `normalize=true`.
              schema: { type: number }
          content:
            image/png:
              schema: { type: string, format: binary }
        "400":
          description: Unknown `kind`, or a `max_size` that is not a positive integer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ----------------------------------------------------------- panoramas ----
  /panoramas:
    get:
      tags: [panoramas]
      operationId: listPanoramas
      summary: All 360 panoramas with pose provenance
      description: |
        Paged: `limit` defaults to the server maximum of 1000.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Panorama inventory
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [panoramas]
                    properties:
                      panoramas:
                        type: array
                        items: { $ref: "#/components/schemas/PanoramaInfo" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /panoramas/{id}:
    get:
      tags: [panoramas]
      operationId: getPanorama
      summary: One panorama's metadata
      parameters:
        - $ref: "#/components/parameters/PanoramaId"
      responses:
        "200":
          description: Panorama metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanoramaInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /panoramas/{id}/image:
    get:
      tags: [panoramas]
      operationId: getPanoramaImage
      summary: The equirectangular image
      description: |
        The stored panorama, JPEG-encoded, in its stored orientation.

        The pixel convention is the one `geometry/EquirectProjection.hpp`
        defines and every other consumer of these images uses: column
        `u` spans longitude `theta` in `[-pi, pi]` left to right, row `v` spans
        latitude from the north pole (`v = 0`) down, and the bearing of a pixel
        in the panorama's own optical frame (x right, y **down**, z forward) is
        `(sin(theta)cos(phi), -sin(phi), cos(theta)cos(phi))`. A client that
        maps this onto a sphere must use that convention or the world will be
        mirrored — which looks plausible and is wrong.
      parameters:
        - $ref: "#/components/parameters/PanoramaId"
        - name: max_size
          in: query
          description: |
            Downscale so the longest edge is at most this many pixels,
            preserving aspect ratio. Never upscales.

            Intended for a panorama picker: a stored equirect is routinely
            8192x4096 and several megabytes, and a strip of twenty thumbnails
            at full resolution is tens of megabytes for a row of 96-pixel
            images.
          schema: { type: integer, minimum: 1, maximum: 4096 }
      responses:
        "200":
          description: Equirectangular JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400":
          description: A `max_size` outside the permitted range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ---------------------------------------------------------- components ----
  /components:
    get:
      tags: [components]
      operationId: listComponents
      summary: Building components, optionally filtered by type
      description: |
        Paged: `limit` defaults to the server maximum of 1000. `total` counts
        the components matching `type`, not every component in the project.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          description: Restrict to one component type (e.g. `window`).
          schema: { type: string }
      responses:
        "200":
          description: Component inventory
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [components]
                    properties:
                      components:
                        type: array
                        items: { $ref: "#/components/schemas/ComponentInfo" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /components/{name}:
    get:
      tags: [components]
      operationId: getComponent
      summary: One component, including its boundary polygon
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Component detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ----------------------------------------------------------- materials ----
  /materials:
    get:
      tags: [materials]
      operationId: listMaterials
      summary: Material passports stored in this project
      description: |
        Paged: `limit` defaults to the server maximum of 1000. A MaterialEPAS
        import can bring in a large catalogue, so this one really can page.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Passport inventory
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [materials]
                    properties:
                      materials:
                        type: array
                        items: { $ref: "#/components/schemas/MaterialInfo" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /materials/{guid}:
    get:
      tags: [materials]
      operationId: getMaterial
      summary: One passport's stored properties
      parameters:
        - name: guid
          in: path
          required: true
          description: The passport's document guid.
          schema: { type: string }
      responses:
        "200":
          description: Passport detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    patch:
      tags: [materials]
      operationId: updateMaterial
      summary: Add, change or clear passport properties
      description: |
        Applies the given property edits and leaves every other property
        untouched. Send only what changed.

        A **`null` value deletes** the property; a string sets it. This is why
        the endpoint is a PATCH over a sparse map rather than a PUT of the whole
        property set: a PUT would make an editor that had not loaded every
        property silently delete the ones it did not know about, and passports
        arrive from MaterialEPAS imports carrying fields no GUI form models.

        A property name the project has never seen is accepted and stored as a
        custom (`string`) field, matching `rux import materialepas`. Passport
        *metadata* — guid, dates, version — is not editable here.

        Performed under the project's writer lock; see `409`/`503`.
      parameters:
        - name: guid
          in: path
          required: true
          description: The passport's document guid.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialPatch" }
      responses:
        "200":
          description: The passport after the edit, in the shape `GET` returns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialDetail" }
        "400":
          description: |
            Body was not an object, `properties` was missing or not an object,
            a property name was empty, or a value was neither a string nor null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WriteConflict" }
        "415":
          description: Content-Type was not application/json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/WriterBusy" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ----------------------------------------------------------- instances ----
  /instances/{cloud}:
    get:
      tags: [instances]
      operationId: listInstances
      summary: Instance rows of an instance-label cloud, with material links
      description: |
        Each row carries the stable GUID that survives regeneration of the
        instance cloud (issue #207), plus the material passport it is linked to
        if any.

        Paged: `limit` defaults to the server maximum of 1000. A scan can hold
        thousands of instances.
      parameters:
        - name: cloud
          in: path
          required: true
          description: Name of the instance-label cloud (usually `instances`).
          schema: { type: string }
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Instance rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [cloud, instances]
                    properties:
                      cloud: { type: string }
                      instances:
                        type: array
                        items: { $ref: "#/components/schemas/InstanceInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------ pipeline ----
  /stages:
    get:
      tags: [pipeline]
      operationId: listStages
      summary: The stage catalogue, with readiness for this project
      description: |
        For every stage the server knows about, reports whether it can be
        submitted as a job (`runnable`), whether cancelling it takes effect
        mid-run (`cancellable`), and whether its documented input contract is
        currently satisfied by this project (`ready`, with `blockers`).

        This is what a pipeline-runner UI should drive its "Run" buttons from —
        it is the same check `rux validate --stage <name>` performs.
      responses:
        "200":
          description: Stage catalogue
          content:
            application/json:
              schema:
                type: object
                required: [stages]
                properties:
                  stages:
                    type: array
                    items: { $ref: "#/components/schemas/StageInfo" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /stages/{stage}/validation:
    get:
      tags: [pipeline]
      operationId: validateStage
      summary: Input-contract validation for one stage
      description: |
        The same record `/stages` returns for this one stage, re-evaluated now.

        A pipeline-runner UI needs this after every run: finishing `clouds`
        unblocks `planes`, and re-fetching the whole catalogue to learn that is
        wasteful when only one card changed. The record shape is deliberately
        identical to a `/stages` element so the client can substitute it in
        place rather than merging two schemas.

        `issues[].hint` carries the derived resolution command (#295) — the
        producing stage of the missing artifact, walked back to the first
        prerequisite that IS satisfied. That is what lets a UI say "run
        `rux create clouds` first" without re-deriving the pipeline order.
      parameters:
        - name: stage
          in: path
          required: true
          schema:
            type: string
            enum: [clouds, planes, rooms, instances, mesh]
          description: A stage listed by `/stages`.
      responses:
        "200":
          description: Stage record, with validation detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageInfo" }
        "404":
          description: No such stage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /pipeline-log:
    get:
      tags: [pipeline]
      operationId: getPipelineLog
      summary: Persisted stage execution history
      description: |
        Rows of the `pipeline_log` table, newest first. This is the durable
        record and survives server restarts, unlike `/jobs`, which only covers
        the current server process and evicts its oldest finished jobs.

        Paged. `limit` keeps a **default of 100** rather than the server
        maximum: this is a history view, and the first screen of one is almost
        never the whole of it. `offset` walks back through it.

        `total` **saturates at 1000**, the server maximum. A project with a
        longer history reports 1000 rather than its true length — there is no
        count query behind this table, and inventing a number would be worse
        than admitting the ceiling.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - name: limit
          in: query
          description: >-
            Maximum rows to return. `0` means "as many as the server will
            give", which is the server maximum (1000) -- never unbounded.
            Values above the maximum are clamped rather than rejected.
          schema: { type: integer, minimum: 0, default: 100, maximum: 1000 }
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [entries]
                    properties:
                      entries:
                        type: array
                        items:
                          { $ref: "#/components/schemas/PipelineLogEntry" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ---------------------------------------------------------------- jobs ----
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: Jobs known to this server, most recent first
      description: |
        In-memory and scoped to the server process. For durable history use
        `/pipeline-log`.

        **This store is bounded and forgets.** Queued and running jobs are
        always listed — they are live state. Finished ones (`succeeded`,
        `failed`, `cancelled`) are retained only up to a server limit, oldest
        dropped first, so a server left open all day does not accumulate job
        records without end. An evicted id answers `404` from
        `GET /jobs/{id}`, exactly as an id from before a restart does, and the
        recovery is the same in both cases: `/pipeline-log`, whose
        `parameters.job_id` carries the job id that caused each run.

        A client that needs a run to still be findable tomorrow must key on
        `pipeline_log`, not on a job id.

        Paged: `limit` defaults to the server maximum of 1000, which is above
        the retention limit, so in practice one page is the whole store.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [jobs]
                    properties:
                      jobs:
                        type: array
                        items: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    post:
      tags: [jobs]
      operationId: submitJob
      summary: Submit a stage run
      description: |
        Returns immediately, without waiting for the stage to run. Progress
        arrives on the `/events` WebSocket; `GET /jobs/{id}` is the polling
        fallback.

        The returned `status` is a **snapshot at response time**, normally
        `queued` — but an idle server may already have started the job, so
        `running` (or even a terminal status, for a stage that fails its input
        contract immediately) is equally valid. Never assert on it; drive the UI
        from the events or from a poll.

        `rux gui` executes jobs one at a time on a single worker thread, so a
        submission may sit in `queued` behind another job. A remote
        implementation is free to run them in parallel — clients must not assume
        either.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequest" }
      responses:
        "202":
          description: Job accepted; the body is its state at response time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400":
          description: Unknown stage, or parameters that are not a JSON object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Names a project this server does not have open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Content-Type was not application/json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /jobs/{id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: One job's current status and progress
      description: |
        A successful terminal job also carries `result`, naming what it wrote —
        which is what a client should refresh from, rather than re-fetching
        every collection on the chance that one of them changed.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404":
          description: |
            No job with that id is known to this server. Three cases, and the
            response cannot tell them apart: the id was never valid, the job
            finished long enough ago to be evicted from the bounded in-memory
            store, or the server restarted since it ran.

            All three recover the same way — look the id up in `/pipeline-log`
            under `parameters.job_id`. A job that actually ran is there; one
            that never existed is not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /jobs/{id}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Request cancellation
      description: |
        Idempotent.

        * A **queued** job is cancelled immediately and never executes.
        * A **running** job has its cancel token set; cancellation is
          cooperative, so the job reaches `cancelled` only when the stage next
          checks. Stages with `cancellable: false` in `/stages` run to
          completion and then report `cancelled`.
        * A **terminal** job is left alone and `200` is still returned.

        Cancellation is a *request*: poll the job or watch `/events` for the
        `job.finished` event to learn the outcome.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Cancellation requested; body is the job's current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ----------------------------------------------------------- websocket ----
  /events:
    get:
      tags: [jobs]
      operationId: openEventStream
      summary: WebSocket progress channel (upgrade)
      description: |
        Not a plain GET — this path answers a WebSocket upgrade. OpenAPI cannot
        describe a WebSocket channel, so the message schema lives in
        `docs/gui/websocket-events.md` and `docs/gui/events.schema.json`.

        Every message is a JSON object with a `type` discriminator mirroring
        `core::IProgressObserver`'s `on_process_started` / `on_process_updated` /
        `on_process_finished` callbacks, attributed to a job.
      responses:
        "101":
          description: Switching protocols to WebSocket
        "400":
          description: Not a WebSocket upgrade request
        default: { $ref: "#/components/responses/UnexpectedError" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token in the `Authorization` header, matching ruxd's
        `--auth-token`.

        **No implementation requires this today.** `rux gui` binds to loopback,
        has no notion of a user, and leaves the document-level `security: []`
        in force — sending a token to it is harmless and ignored. The scheme is
        declared now so that the Phase 6 remote deployment (ruxd) is a change
        of *which* security requirement applies, not a change to the operations
        themselves.

  parameters:
    Offset:
      name: offset
      in: query
      description: |
        Index of the first item to return, in the collection's own documented
        order. A page past the end is a `200` with `count: 0`, never a `404`.
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      description: |
        Maximum items to return. `0` means "as many as the server will give",
        which is that collection's **server maximum** — never unbounded. A
        value above the maximum is clamped rather than rejected, so a client
        may always ask for more than it expects to get.

        Each operation documents its own default and maximum: they differ by
        how expensive an item is to produce, not by idiom.
      schema: { type: integer, minimum: 0, default: 0 }
    CloudName:
      name: name
      in: path
      required: true
      description: The cloud's name, e.g. `cloud`, `normals`, `planes`.
      schema: { type: string }
    MeshName:
      name: name
      in: path
      required: true
      description: The mesh's name.
      schema: { type: string }
    GsplatName:
      name: name
      in: path
      required: true
      description: The splat's name in the project, e.g. `splat`.
      schema: { type: string }
    FrameId:
      name: id
      in: path
      required: true
      description: Sensor frame `node_id`.
      schema: { type: integer }
    PanoramaId:
      name: id
      in: path
      required: true
      description: Panorama row id.
      schema: { type: integer }
    JobId:
      name: id
      in: path
      required: true
      description: Opaque server-generated job identifier.
      schema: { type: string }

  responses:
    UnexpectedError:
      description: |
        Any failure that is not specific to this operation. Three can come back
        from **every** route, whatever it does, which is why they are attached
        as a `default` rather than repeated per operation:

        * `403` — the request carried a browser `Origin` that is not
          allowlisted. Refused before any handler runs.
        * `415` — a mutating route was called without
          `Content-Type: application/json`.
        * `503` — the project database was momentarily locked; the request
          changed nothing and is safe to retry.

        A generated client should treat this as the catch-all arm: the body is
        always an `Error`, so `error` is readable without knowing the status.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProjectUnavailable:
      description: The project database could not be opened
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WriteConflict:
      description: |
        The edit conflicts with the project's state and was not applied — a
        pipeline job is running or queued, or the resource is one this server
        refuses to edit. The message names which. Retrying a job conflict once
        the job finishes will succeed; retrying a refusal never will.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WriterBusy:
      description: |
        The writer lock could not be taken in time, so nothing was written. The
        edit is safe to retry as-is.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:

    Page:
      type: object
      description: |
        The pagination envelope every paged collection carries alongside its
        items. One idiom, one set of field names, everywhere:

        * `offset` — echo of the requested offset, so a response is
          self-describing when it arrives out of order.
        * `count` — items in **this** page.
        * `total` — items available under the request's filters, which is what
          `offset + count < total` tests against. Where an operation also
          reports unfiltered totals (`/frames`), those keep their own names and
          are documented separately.

        Collections whose size is fixed by the server build or bounded by one
        parent object are deliberately **not** paged and carry no envelope:
        `/endpoints`, `/stages`, `/meshes/{name}/textures`. Paging them would
        add a round trip to answer a question that has no second page.
      required: [offset, count, total]
      properties:
        offset: { type: integer }
        count: { type: integer }
        total: { type: integer }

    Error:
      description: |
        Returned for **every** non-2xx response, without exception, so a client
        can read `error` before it has decided what the status means.

        The statuses that are not specific to any one operation -- `403`, `415`
        and `503` -- are attached to each operation as a `default` response;
        see `UnexpectedError` for what each means.

        On `403` in particular: cross-origin browser access is refused
        server-side, and preflighted (JSON-bodied) cross-origin requests are
        **not supported at all**. Crow 1.3 answers `OPTIONS` from
        `Router::handle_initial()`, which runs before the request headers are
        parsed, so the server cannot see the `Origin` at preflight time and
        cannot emit a correct preflight response; decorating Crow's own 204
        afterwards proved unreliable, losing the added headers on the first
        OPTIONS of a fresh connection. This is a limitation of the HTTP layer,
        not a gap to be filled in -- lifting it needs an upstream Crow change
        or a different server. The supported model is same-origin (the server
        serves the bundle in production, Vite `server.proxy` in development),
        which costs nothing because both real deployments already are.
        See docs/gui/README.md.
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable failure reason. Never empty.
        status:
          type: integer
          description: The HTTP status, repeated for convenience.

    Health:
      type: object
      required: [status, api_version, version, project]
      properties:
        status: { type: string, enum: [ok] }
        api_version:
          type: string
          description: Contract version served under this prefix.
          examples: ["1.0.0"]
        version:
          type: string
          description: ReUseX build version.
        implementation:
          type: string
          description: Which backend is answering.
          enum: [rux-gui, ruxd]
        project:
          type: object
          description: The single project this server is bound to.
          required: [name, open]
          properties:
            name:
              type: string
              description: Project file name (never a full server path).
            open:
              type: boolean
              description: False when the database could not be opened.
            schema_version: { type: integer }

    EndpointInfo:
      type: object
      required: [method, path, summary]
      properties:
        method: { type: string, examples: ["GET"] }
        path: { type: string, examples: ["/api/v1/clouds/<name>"] }
        summary: { type: string }
        binary:
          type: boolean
          description: True when the response is not JSON.

    ProjectSummary:
      type: object
      description: |
        The dashboard payload. Mirrors `ProjectDB::project_summary()` — one
        request, everything an overview screen needs.
      required:
        [path, schema_version, projects, clouds, meshes, sensor_frames,
         panoramic_images, components, materials]
      properties:
        path:
          type: string
          description: |
            The project **file name** only. The server never discloses its
            filesystem layout, so this stays meaningful for a remote backend.
        schema_version: { type: integer }
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectInfo" }
        clouds:
          type: array
          items: { $ref: "#/components/schemas/CloudInfo" }
        meshes:
          type: array
          items: { $ref: "#/components/schemas/MeshInfo" }
        sensor_frames:
          type: object
          required: [total_count, segmented_count]
          properties:
            total_count: { type: integer }
            segmented_count: { type: integer }
            width: { type: integer }
            height: { type: integer }
        panoramic_images:
          type: object
          required: [total_count, matched_count]
          properties:
            total_count: { type: integer }
            matched_count:
              type: integer
              description: Panoramas linked to a sensor frame.
        components:
          type: object
          required: [total_count, count_by_type]
          properties:
            total_count: { type: integer }
            count_by_type:
              type: object
              additionalProperties: { type: integer }
        materials:
          type: array
          items: { $ref: "#/components/schemas/MaterialInfo" }

    ProjectInfo:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        building_address: { type: string }
        year_of_construction:
          type: integer
          description: 0 means "not set".
        survey_date: { type: string }
        survey_organisation: { type: string }
        notes: { type: string }

    CloudInfo:
      type: object
      required: [name, type, point_count, width, height, organized]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [PointXYZRGB, Normal, Label, PointXYZ]
        point_count: { type: integer }
        width: { type: integer }
        height: { type: integer }
        organized:
          type: boolean
          description: True when the cloud has 2D structure (height > 1).
        labels:
          type: object
          description: |
            Label id to name, for `Label` clouds only. Key `"0"` is never
            present: 0 means unlabeled (STANDARDS §3).
          additionalProperties: { type: string }

    CloudPointsPage:
      description: |
        A page of points. Carries the same `offset`/`count`/`total` envelope as
        every other paged collection — the unit is a point rather than a row,
        but the arithmetic a client does is identical.
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [name, type, fields, points]
          properties:
            name: { type: string }
            type: { type: string }
            fields:
              type: array
              description: Field names, in the order they appear in each row.
              items: { type: string }
            points:
              type: array
              description: One array per point, matching `fields`.
              items:
                type: array
                items: { type: number }
            lod:
              type: boolean
              description: >-
                Present only on a `max_points` request. True when these rows are
                a voxel subsample of the whole cloud rather than a window of it;
                false when the cloud already fit the budget and came back
                complete, in storage order.
            voxel_size:
              type: number
              description: >-
                Edge length of the voxel the subsample settled on, in cloud
                units. Present only when `lod` is true.

    MeshInfo:
      type: object
      required: [name, vertex_count, face_count]
      properties:
        name: { type: string }
        format:
          type: string
          description: Storage format of the geometry blob.
          enum: [ply, obj]
        vertex_count: { type: integer }
        face_count: { type: integer }
        stage: { type: string }
        parameters:
          type: string
          description: The stage parameters JSON, as stored.
        created_at: { type: string }
        texture_count: { type: integer }

    TextureInfo:
      type: object
      required: [tex_name, format, width, height]
      properties:
        tex_name: { type: string }
        format: { type: string }
        width: { type: integer }
        height: { type: integer }

    GsplatInfo:
      description: |
        One 3D Gaussian Splatting model stored in the project, described from
        its PLY header so a client knows the cost and the colour model before
        fetching the blob.
      type: object
      required: [name, format, gaussian_count, sh_degree, byte_size]
      properties:
        name:
          type: string
          description: The splat's name in the project (`rux create gsplat --name`).
        format:
          type: string
          description: Storage format of the blob.
          enum: [ply]
        gaussian_count:
          type: integer
          description: |
            `element vertex` from the PLY header — the number of Gaussians.
        sh_degree:
          type: integer
          description: |
            Spherical-harmonic degree, derived from the count of `f_rest_*`
            properties (3 * ((degree + 1)^2 - 1) of them). 0 means
            view-independent colour, not "missing".
        byte_size: { type: integer }
        stage:
          type: string
          description: The stage that produced it, e.g. `gsplat`.
        parameters:
          type: string
          description: The stage parameters JSON, as stored.
        created_at: { type: string }

    FrameList:
      description: |
        Frame ids, paged, plus the two whole-scan counts a browser needs to
        render "42 of 380 segmented" without a second request.

        Read `total` and `total_count` carefully: `total` (from the pagination
        envelope) is how many ids match the `segmented` filter, `total_count`
        is how many frames the scan holds. They differ exactly when the filter
        is in use.
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [ids, total_count, segmented_count]
          properties:
            ids:
              type: array
              description: This page of ids, ascending.
              items: { type: integer }
            total_count:
              type: integer
              description: Frames in the whole scan, ignoring filter and page.
            segmented_count:
              type: integer
              description: >-
                Frames in the whole scan that have a stored segmentation image,
                ignoring filter and page.
            width: { type: integer }
            height: { type: integer }

    FrameInfo:
      type: object
      required: [id, pose, has_segmentation]
      properties:
        id: { type: integer }
        timestamp:
          type: number
          description: Epoch seconds; -1 when unknown.
        pose:
          type: array
          description: >-
            Row-major 4x4 world pose, verbatim as stored. A frame with no
            stored pose reads back as identity, so check `has_pose` before
            trusting it.
          items: { type: number }
          minItems: 16
          maxItems: 16
        has_pose:
          type: boolean
          description: >-
            Whether `pose` is a usable stored pose (present, finite, bottom row
            [0,0,0,1], non-degenerate rotation) rather than the identity
            fallback or a degenerate transform.
        intrinsics: { $ref: "#/components/schemas/Intrinsics" }
        has_depth: { type: boolean }
        has_confidence: { type: boolean }
        has_segmentation: { type: boolean }

    Intrinsics:
      type: object
      required: [fx, fy, cx, cy, width, height]
      properties:
        fx: { type: number }
        fy: { type: number }
        cx: { type: number }
        cy: { type: number }
        width: { type: integer }
        height: { type: integer }
        local_transform:
          type: array
          description: Row-major 4x4 camera-to-base transform.
          items: { type: number }
          minItems: 16
          maxItems: 16

    PanoramaInfo:
      type: object
      required: [id, filename, node_id, has_pose, pose_source, has_frame_pose]
      properties:
        id: { type: integer }
        filename: { type: string }
        timestamp: { type: number }
        node_id:
          type: integer
          description: Matched sensor frame, -1 if unmatched.
        has_pose:
          type: boolean
          description: True once `rux align 360` has refined the pose.
        pose:
          type: array
          items: { type: number }
          minItems: 16
          maxItems: 16
          description: |
            Row-major 4x4 camera-to-world pose from content-based alignment,
            verbatim as stored — **identity until `rux align 360` has run**.
            Check `has_pose` before using it.
        pose_source: { type: string, enum: [timestamp, aligned] }
        align_inliers: { type: integer }
        align_rms:
          type: number
          description: Angular RMS of inlier bearings, degrees. -1 if unaligned.
        has_frame_pose:
          type: boolean
          description: |
            Whether `frame_pose` is present: `node_id` names a sensor frame and
            that frame has a stored pose.
        frame_pose:
          type: array
          items: { type: number }
          minItems: 16
          maxItems: 16
          description: |
            Row-major 4x4 pose of the **timestamp-matched sensor frame**
            (`node_id`), derived on read rather than stored.

            It is here so that a client can place an unaligned panorama in
            space at all: `pose` is identity until `rux align 360` has run, and
            resolving `node_id` client-side costs one `GET /frames/{id}` per
            panorama — each of which decodes that frame's depth and confidence
            blobs to answer its availability flags.

            Deliberately a **separate field** rather than a fallback folded
            into `pose`. A borrowed frame pose is a different claim from a
            resected one — it carries the panorama's mounting offset and the
            timestamp-match error — and `has_pose` / `pose_source` exist so a
            client can say which it is showing.

    ComponentInfo:
      type: object
      required: [name, guid, type]
      properties:
        name: { type: string }
        guid: { type: string }
        type: { type: string }
        parent_id:
          type: integer
          description: |
            Parent **component**, -1 if none. This is not a room: ReUseX does
            not associate a building component with a room, and this field must
            not be presented as if it did.
        confidence:
          type: number
          description: -1 means manually created.
        vertex_count: { type: integer }
        area:
          type: number
          description: |
            Boundary area in m², computed from the stored polygon (Newell) and
            **not** a persisted field — it is derived on read, so it always
            agrees with the geometry rather than with whatever wrote it last.
            Absent when the boundary has fewer than three vertices.
        source_instance_guid:
          type: string
          description: |
            The segmentation instance this component was derived from (#211),
            lifted out of the opaque `metadata` JSON so a table can show
            provenance without every client re-parsing it. Absent when the
            component was created manually or carries no such link.

    ComponentDetail:
      allOf:
        - $ref: "#/components/schemas/ComponentInfo"
        - type: object
          properties:
            plane:
              type: array
              description: Hessian normal form [a, b, c, d].
              items: { type: number }
              minItems: 4
              maxItems: 4
            vertices:
              type: array
              description: Boundary vertices as [x, y, z] triples.
              items:
                type: array
                items: { type: number }
                minItems: 3
                maxItems: 3
            metadata:
              type: string
              description: Opaque type-specific JSON, as stored.
            notes: { type: string }

    LabelLegend:
      type: object
      required: [labels]
      properties:
        labels:
          type: object
          description: |
            Label id (as a string, because JSON keys are strings) → display
            name. `"0"` never appears: 0 means unlabeled.
          additionalProperties: { type: string }
          examples:
            - { "1": "wall", "2": "floor" }

    MaterialPatch:
      type: object
      required: [properties]
      properties:
        properties:
          type: object
          description: |
            Property name → new value. `null` deletes the property. Names not
            already known to the project are created as custom string fields.
          additionalProperties:
            type: [string, "null"]
          examples:
            - { "Designation": "Oak beam", "Obsolete field": null }

    MaterialInfo:
      type: object
      required: [guid]
      properties:
        id: { type: string }
        guid: { type: string }
        property_count: { type: integer }
        created_at: { type: string }
        version_number: { type: string }

    MaterialDetail:
      allOf:
        - $ref: "#/components/schemas/MaterialInfo"
        - type: object
          properties:
            linked_node_id:
              type: integer
              description: Sensor frame the passport was captured from, if any.
            properties:
              type: object
              additionalProperties: { type: string }

    InstanceInfo:
      type: object
      required: [instance_id, guid, semantic_class, point_count]
      properties:
        instance_id:
          type: integer
          description: Label value in the instance cloud (>= 1).
        guid:
          type: string
          description: Stable identity, survives regeneration.
        semantic_class: { type: integer }
        point_count: { type: integer }
        material_guid:
          type: [string, "null"]
          description: Linked material passport, null when unlinked.

    StageInfo:
      type: object
      required:
        [stage, log_name, summary, command, runnable, cancellable, ready,
         outputs, blockers, issues, parameters]
      properties:
        stage:
          type: string
          description: Token accepted by `POST /jobs`.
          enum: [clouds, planes, rooms, instances, mesh]
        log_name:
          type: string
          description: >-
            The value this stage writes into `pipeline_log.stage`. Deliberately
            not the wire token -- the CLI has written `segment_planes` /
            `cloud_reconstruction` into that column since long before the GUI
            existed, and existing databases are full of those values. Exposed
            so a history view can be joined to a stage card without hard-coding
            the mapping. Empty for a stage with no runner.
        summary:
          type: string
          description: One-line description, from the stage contract table.
        command:
          type: string
          description: The `rux` command that runs this stage.
        runnable:
          type: boolean
          description: False when no job runner exists for it yet.
        cancellable:
          type: boolean
          description: |
            True when cancellation takes effect mid-run. False means a cancel
            request is honoured only after the stage finishes.
        ready:
          type: boolean
          description: True when the stage's input contract is satisfied.
        outputs:
          type: array
          description: >-
            Artifacts this stage writes. A view showing one of these empty can
            name the stage that fills it instead of shrugging.
          items: { type: string }
        blockers:
          type: array
          description: >-
            Why `ready` is false, as flat printable strings; empty when it is
            true. A summary of the error-severity entries in `issues`.
          items: { type: string }
        issues:
          type: array
          description: >-
            Every validation finding, including warnings and the derived
            resolution hint. This is the machine-readable form; `blockers` is
            the printable one.
          items: { $ref: "#/components/schemas/ValidationIssue" }
        parameters:
          type: array
          description: >-
            The knobs `POST /jobs` accepts for this stage, with the defaults
            read from the library option structs. Empty for a stage with no
            runner. A form built from this cannot drift from the library the
            way a hard-coded one does (STANDARDS §4).
          items: { $ref: "#/components/schemas/StageParameter" }

    ValidationIssue:
      type: object
      required: [check, message, severity, hint, artifact, commands]
      properties:
        check:
          type: string
          description: Machine-readable check id, e.g. `missing_input`.
        message:
          type: string
          description: Human-readable description of the problem.
        severity:
          type: string
          enum: [warning, error]
          description: Only `error` entries make a stage unready.
        hint:
          type: string
          description: >-
            The command to run to fix it, derived from the stage contract
            table (#295). Empty when there is no mechanical resolution.
        artifact:
          type: string
          description: >-
            The named cloud/table the issue is about, when it is about one;
            empty otherwise. Surfaced separately so a UI can list the missing
            inputs without regex-ing `message`, which is prose.
        commands:
          type: array
          description: >-
            The same resolution as `hint`, in order, as separate commands.
            `hint` is formatted for a terminal and is multi-line when several
            steps are needed; a GUI wants the steps, not the layout, and
            parsing them back out of the prose would be a second source of
            truth. Empty when there is no mechanical resolution.
          items: { type: string }

    StageParameter:
      type: object
      required:
        [key, type, label, description, default, minimum, maximum,
         presence_sensitive]
      properties:
        key:
          type: string
          description: >-
            The key to send inside `JobRequest.parameters`. This mirrors the
            library option-struct field name, which is not always the CLI flag
            spelling -- `clouds` reads `resolution`, the CLI calls it `--grid`.
        type:
          type: string
          enum: [number, integer, boolean, string, integer_list]
        label:
          type: string
          description: Short form-field label.
        description:
          type: string
          description: One-line explanation, mirroring the CLI help.
        default:
          description: >-
            The value the stage uses when the key is omitted. Null means the
            parameter has no neutral value and is absent by default -- a form
            must leave it blank rather than invent one.
          type: [number, integer, boolean, string, "null"]
        minimum:
          type: [number, "null"]
          description: Inclusive lower bound, null when unbounded.
        maximum:
          type: [number, "null"]
          description: Inclusive upper bound, null when unbounded.
        presence_sensitive:
          type: boolean
          description: >-
            True when sending the key AT ALL changes behaviour regardless of
            its value (#214) -- `planes.plane_dist_threshold` and
            `planes.min_inliers` pin themselves and switch off adaptive
            derivation. A form must omit an untouched presence-sensitive key
            rather than echo its default back, which would silently disable
            adaptivity.

    PipelineLogEntry:
      type: object
      required: [id, stage, status, started_at]
      properties:
        id: { type: integer }
        stage: { type: string }
        status: { type: string, enum: [running, success, failed] }
        started_at: { type: string }
        finished_at:
          type: string
          description: Empty while still running.
        parameters:
          type: string
          description: >-
            Stage parameters JSON, as stored. When the run was started through
            `POST /jobs` this object also carries a `job_id` key holding that
            job's id, so durable history can be joined back to the job that
            caused it -- the recovery path for a client that reconnects after a
            server restart, when `/jobs` no longer knows the job.
        error_msg:
          type: string
          description: Empty when there was no error.

    JobRequest:
      type: object
      required: [stage]
      properties:
        project:
          type: string
          description: >-
            Project this job is meant for, as reported by `GET /health` under
            `project.name`. Optional against a single-project server such as
            `rux gui`, which answers 409 if it names anything other than the
            project it has open. A multi-project backend (ruxd, Phase 6) will
            require it. Send it: it costs nothing, and it is what stops a
            client pointed at the wrong server from quietly running a stage
            over the wrong data.
        stage:
          type: string
          description: "A stage with `runnable: true` in `/stages`."
          enum: [clouds, planes, rooms, instances]
        parameters:
          type: object
          description: |
            Stage-specific parameters. Keys mirror the library option-struct
            field names; unknown keys are ignored, omitted keys take the
            library default (never a CLI-only default — STANDARDS §4).
          additionalProperties: true

    Job:
      type: object
      required: [id, project, stage, status, submitted_at]
      properties:
        id: { type: string }
        project:
          type: string
          description: >-
            The project this job belongs to. Always present, so a client can
            key its state on it whether it is talking to a single-project
            `rux gui` or a multi-project ruxd.
        stage: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        parameters:
          type: object
          description: Parameters as submitted.
          additionalProperties: true
        error:
          type: string
          description: Failure reason; empty unless status is failed/cancelled.
        submitted_at: { type: string, format: date-time }
        started_at:
          type: string
          description: Empty while queued.
        finished_at:
          type: string
          description: Empty until terminal.
        cancel_requested: { type: boolean }
        progress: { $ref: "#/components/schemas/JobProgress" }
        result: { $ref: "#/components/schemas/JobResult" }

    JobResult:
      type: object
      description: |
        What a job actually produced. Present **only** on `status: succeeded`;
        a failed or cancelled job reports through `error` instead, and a job
        that has not finished has no result to report.

        This exists so a client does not have to infer the consequence of a run
        from its stage name. Knowing that a `planes` job succeeded tells a UI
        that *something* changed; `outputs` tells it that `planes`,
        `plane_centroids` and `plane_normals` are the clouds to re-fetch, and
        leaves the rest of the screen alone.
      required: [summary, outputs]
      properties:
        summary:
          type: string
          description: >-
            The stage's own one-line account of what it did, e.g. "detected 37
            plane(s)". Written for a human to read; do not parse it.
        outputs:
          type: array
          description: >-
            The artifacts this run wrote, as reported by the stage itself. A
            stage lists only what it actually persisted on this run -- this is
            not the stage's declared output contract (that is `outputs` on
            `StageInfo`, which says what the stage writes in general).
          items: { $ref: "#/components/schemas/JobArtifact" }

    JobArtifact:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          description: Which endpoint family the artifact is fetched from.
          enum: [cloud, mesh, table]
        name:
          type: string
          description: >-
            The stored name, e.g. `planes`. For `kind: cloud` this is the
            `{name}` of `GET /clouds/{name}`, so a refresh needs no mapping.
        count:
          type: integer
          description: >-
            Points or rows written. **Absent when the stage does not have an
            honest number to report** -- an omitted count means "not measured",
            never zero, and a UI must not render it as one.

    JobProgress:
      description: >-
        Live progress of the phase the stage is currently in. The WebSocket
        envelope additionally carries a monotonic `seq` -- order events by
        that, not by arrival (docs/gui/websocket-events.md).
      type: object
      required: [stage, stage_label, current, total]
      properties:
        stage:
          type: string
          description: |
            Machine-readable token for the `core::Stage` phase currently
            reporting, e.g. `region_growing` — lower-case with underscores.
            A job may pass through several phases. Match on this, never on
            `stage_label`.
        stage_label:
          type: string
          description: |
            The same phase in display form, e.g. "Region Growing". Provided so
            a UI does not have to re-prettify the token, and so wording can
            change without breaking clients.
        current: { type: integer }
        total:
          type: integer
          description: 0 means indeterminate — render a spinner, not a bar.
        fraction:
          type: [number, "null"]
          description: current/total, or null when total is 0.
