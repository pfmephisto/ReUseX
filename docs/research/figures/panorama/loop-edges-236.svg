<svg xmlns="http://www.w3.org/2000/svg" width="900" height="656" viewBox="0 0 900 656" font-family="Helvetica,Arial,sans-serif">
<rect width="900" height="656" fill="#fcfcfb"/>
<text x="300" y="30" fill="#0b0b0b" font-size="16" font-weight="600">A. Where the panorama loop edges go</text>
<text x="300" y="50" fill="#52514e" font-size="12">NewOffice: 18 panoramas, 16 matched ≥ 2 frames, 95 independent per-frame resections</text>
<text x="288" y="92" fill="#52514e" font-size="12.5" text-anchor="end">frame pairs proposed</text>
<rect x="300" y="74" width="530.0" height="26" fill="#2a78d6" rx="4"/>
<text x="839.0" y="92" fill="#0b0b0b" font-size="12.5" font-weight="600">278</text>
<text x="288" y="132" fill="#52514e" font-size="12.5" text-anchor="end">after gap / seed / cap gates</text>
<rect x="300" y="114" width="360.3" height="26" fill="#2a78d6" rx="4"/>
<text x="669.3" y="132" fill="#0b0b0b" font-size="12.5" font-weight="600">189</text>
<text x="288" y="172" fill="#52514e" font-size="12.5" text-anchor="end">survive PCM → reach the graph</text>
<rect x="300" y="154" width="5.7" height="26" fill="#2a78d6" rx="4"/>
<text x="314.7" y="172" fill="#0b0b0b" font-size="12.5" font-weight="600">3</text>
<text x="300" y="200" fill="#52514e" font-size="11.5">186 of 189 edges fail PCM's mutual-consistency test. Force the rest</text>
<text x="300" y="216" fill="#52514e" font-size="11.5">through (--loop-trust) and quality collapses (panel B, last row) — so</text>
<text x="300" y="232" fill="#52514e" font-size="11.5">the rejection is the guardrail working, not misfiring.</text>
<text x="300" y="274" fill="#0b0b0b" font-size="16" font-weight="600">B. GT-free flatness (lower is better)</text>
<text x="300" y="294" fill="#52514e" font-size="12">rux analyze quality on the rebuilt cloud + planes, identical params per row</text>
