<text x="732.0" y="792.0" fill="#52514e" font-size="11">on a ~2 m trajectory,</text>
<text x="732.0" y="806.0" fill="#52514e" font-size="11">but the seed is</text>
<text x="732.0" y="820.0" fill="#52514e" font-size="11">already accurate to</text>
