<text x="732.0" y="736.0" fill="#52514e" font-size="11">Why: on these</text>
<text x="732.0" y="750.0" fill="#52514e" font-size="11">scans the edges</text>
<text x="732.0" y="764.0" fill="#52514e" font-size="11">disagree with the</text>
