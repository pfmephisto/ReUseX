<text x="732.0" y="232.0" fill="#52514e" font-size="11">The three drifting</text>
<text x="732.0" y="246.0" fill="#52514e" font-size="11">scans rise to zero</text>
<text x="732.0" y="260.0" fill="#52514e" font-size="11">and stop: their best</text>
<text x="732.0" y="274.0" fill="#52514e" font-size="11">plane weight is OFF.</text>
<text x="732.0" y="296.0" fill="#52514e" font-size="11">honka (no drift) is</text>
<text x="732.0" y="310.0" fill="#52514e" font-size="11">the only scan with a</text>
<text x="732.0" y="324.0" fill="#52514e" font-size="11">peak above zero —</text>
<text x="732.0" y="338.0" fill="#52514e" font-size="11">at the shipped 1.0.</text>
<text x="92.0" y="434.0" fill="#0b0b0b" font-size="14" font-weight="600">B. Office scan — GT-free flatness_rms, mm (lower is better)</text>
<text x="92.0" y="456.0" fill="#52514e" font-size="12">The GT-free metric disagrees: on the scan the defaults were tuned on, the optimum is the shipped 1.0, not off.</text>
