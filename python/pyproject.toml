#
# Packaging metadata for the reusex_sam3 export pipeline. Deps are pinned as
# PREBUILT WHEELS — install into a venv, never build torch from nix source
# (the machine OOMs compiling torch). See requirements.txt for the full recipe
# and the pytorch cu124 index hint.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reusex_sam3"
version = "0.1.0"
description = "SAM 3.1 (multiplex) -> ONNX -> TensorRT export pipeline for ReUseX"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Povl Filip Sonne-Frederiksen" }]

# Prebuilt-wheel deps. torch/torchvision may need the pytorch cu124 index:
#   pip install torch==2.9.0 torchvision==0.24.0 \
#       --index-url https://download.pytorch.org/whl/cu124
dependencies = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "onnx==1.17.0",
    "onnxruntime-gpu==1.20.1",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "huggingface_hub==0.26.2",
    "polygraphy==0.49.9",
    "timm==1.0.11",
    "iopath==0.1.10",
    "regex",
    "ftfy",
]

[project.optional-dependencies]
int8 = ["nvidia-modelopt[onnx]==0.19.0"]

[tool.setuptools]
packages = ["reusex_sam3"]
